<style>
/* Layout: sticky ice header with scrolling nav, navy hero stage with floating illustrations, alternating ice/white bands, one WhatsApp float. */
:root{
  --font-display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --font-body:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;
  --navy:#0B1E3F; --navy-2:#13305F; --ice:#BFE3F8;
  --bg:#F5FAFE; --surface:#FFFFFF; --surface-2:#E8F3FB; --fg:#0B1E3F; --muted:#485E7E; --line:#D2E2F0;
  --accent:#1B4A8C; --btn-bg:#0B1E3F; --btn-fg:#FFFFFF;
  --tile-a:#DCEEFA; --tile-b:#F7FBFF; --shadow:0 12px 32px rgba(11,30,63,.12);
  --wa:#118347;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07142B; --surface:#0E2145; --surface-2:#0B1B3A; --fg:#EAF5FD; --muted:#A2BAD4; --line:#1E3A66;
    --accent:#8CCFF4; --btn-bg:#BFE3F8; --btn-fg:#0B1E3F;
    --tile-a:#17386A; --tile-b:#0E2248; --shadow:0 12px 32px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07142B; --surface:#0E2145; --surface-2:#0B1B3A; --fg:#EAF5FD; --muted:#A2BAD4; --line:#1E3A66;
  --accent:#8CCFF4; --btn-bg:#BFE3F8; --btn-fg:#0B1E3F;
  --tile-a:#17386A; --tile-b:#0E2248; --shadow:0 12px 32px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:4px 18px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand-mark{width:40px;height:40px;border-radius:50%;background:var(--navy);color:var(--ice);display:grid;place-items:center;font:700 18px var(--font-display);letter-spacing:.02em;flex:none}
.logo{background:none;object-fit:cover;display:block}
.brand-name{font:700 20px/1.05 var(--font-display)}
.brand-name small{display:block;font:500 10px var(--font-body);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.hdr-actions{display:flex;gap:8px;margin-left:auto;order:2}
.nav{display:flex;gap:2px;overflow-x:auto;order:3;width:100%;scrollbar-width:none;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:8px 13px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;font-size:14.5px;white-space:nowrap}
.nav a:hover{color:var(--fg)}
.nav a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.count{display:inline-grid;place-items:center;min-width:19px;height:19px;border-radius:99px;background:var(--btn-bg);color:var(--btn-fg);font-size:11px;font-weight:600;margin-left:6px;padding:0 5px}
@media(min-width:900px){
  .nav{order:2;width:auto;margin-left:auto}
  .hdr-actions{margin-left:0;order:3}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;border:1px solid transparent;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;background:var(--btn-bg);color:var(--btn-fg);transition:transform .2s,box-shadow .2s;line-height:1.2}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn.sm{padding:8px 16px;font-size:14px}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.wa{background:var(--wa);color:#fff}
.btn.ice{background:#BFE3F8;color:#0B1E3F}
.btn.line-w{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.btn[aria-disabled="true"]{opacity:.55;pointer-events:none}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);font-variant-numeric:tabular-nums}
.step button{width:34px;height:34px;border:0;background:transparent;color:inherit;font-size:18px;cursor:pointer;border-radius:50%}
.step span{min-width:22px;text-align:center;font-weight:600;font-size:14px}

/* hero */
.hero{background:radial-gradient(60% 80% at 80% 30%,rgba(191,227,248,.22),transparent 62%),linear-gradient(165deg,#0B1E3F 0%,#12295A 100%);color:#fff;overflow:hidden}
.hero .wrap{display:grid;gap:28px;align-items:center;padding-block:clamp(36px,6vw,80px)}
@media(min-width:860px){.hero .wrap{grid-template-columns:1.05fr .95fr}}
.hero .eyebrow{color:#BFE3F8}
.hero h1{font:600 clamp(2.7rem,7.2vw,5.2rem)/.98 var(--font-display);margin:12px 0 18px;text-wrap:balance;letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:#BFE3F8}
.hero .lead{color:#CFE3F4;max-width:46ch;font-size:17px}
.hero-ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.hero-art{position:relative;min-width:0;aspect-ratio:1/.95;max-width:480px;width:100%;justify-self:center}
.halo{position:absolute;inset:6% 4%;border-radius:50%;background:radial-gradient(circle,rgba(191,227,248,.32),rgba(191,227,248,0) 68%)}
.hero-art .glyph{position:absolute;filter:drop-shadow(0 18px 24px rgba(0,0,0,.35))}
.a1{width:50%;left:8%;bottom:4%;animation:float 6s ease-in-out infinite}
.a2{width:38%;right:6%;bottom:14%;animation:float 7s ease-in-out -2s infinite}
.a3{width:27%;right:36%;top:2%;animation:float 8s ease-in-out -4s infinite}
.bub{position:absolute;border-radius:50%;border:1px solid rgba(191,227,248,.5);animation:float 9s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes rise{from{transform:translateY(10px)}}
.page{animation:rise .45s ease both}

/* sections */
.sec{padding-block:clamp(44px,7vw,88px)}
.sec.alt{background:var(--surface-2)}
.sec-h{max-width:640px;margin-bottom:28px;display:grid;gap:8px}
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:600}
h2{font:600 clamp(2rem,4.6vw,3.1rem)/1.05 var(--font-display);text-wrap:balance}
.intro{color:var(--muted);font-size:17px}
.page-head{background:var(--surface-2);border-bottom:1px solid var(--line)}
.page-head .wrap{padding-block:clamp(34px,6vw,64px);display:grid;gap:10px;max-width:1160px}
.page-head h1{font:600 clamp(2.4rem,6vw,4rem)/1 var(--font-display);text-wrap:balance}
.page-head p{color:var(--muted);max-width:56ch;font-size:17px}
.split{display:grid;gap:32px;align-items:start}
@media(min-width:820px){.split{grid-template-columns:1fr 1fr}}
.split>*{min-width:0}
.values{display:grid;gap:14px}
.value{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.value h3{font:600 22px/1.1 var(--font-display);margin-bottom:4px}
.value p{color:var(--muted);font-size:15px}

/* grids and cards */
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.tile{aspect-ratio:4/3;max-width:100%;background:linear-gradient(160deg,var(--tile-a),var(--tile-b));display:grid;place-items:center}
.tile .glyph{width:54%;max-width:150px}
.card-body{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font:600 23px/1.1 var(--font-display)}
.card p{color:var(--muted);font-size:14.5px}
.card-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px}
.price{font-weight:600;font-variant-numeric:tabular-nums}
.pill{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;background:var(--surface-2);color:var(--accent);padding:3px 10px;border-radius:999px;width:fit-content}
.glyph{display:block;line-height:0}
.glyph svg{width:100%;height:auto;display:block}
.cats{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
.cat{display:grid;justify-items:center;gap:8px;padding:16px 10px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-decoration:none;text-align:center;font-weight:500;font-size:14.5px;line-height:1.25;transition:transform .2s,box-shadow .2s}
.cat:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.cat .glyph{width:66px}
.list{display:grid}
.row{display:flex;align-items:center;gap:12px 14px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.thumb{width:58px;flex:none;border-radius:14px;padding:6px;background:linear-gradient(160deg,var(--tile-a),var(--tile-b))}
.row-t{flex:1 1 190px;min-width:0;display:grid}
.row-t small{color:var(--muted);font-size:13.5px;line-height:1.4}
.row .price{margin-left:auto}

/* deals */
.deals{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.deal{background:linear-gradient(160deg,#0B1E3F,#13305F);color:#fff;border-radius:22px;display:grid;grid-template-columns:104px 1fr;gap:18px;padding:22px;align-items:center;min-width:0}
.deal .glyph{width:100%}
.deal-b{display:grid;gap:6px;min-width:0}
.deal h3{font:600 26px/1.05 var(--font-display)}
.deal p{color:#CFE3F4;font-size:14.5px}
.save{background:#BFE3F8;color:#0B1E3F;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;padding:3px 10px;border-radius:999px;width:fit-content}
.deal-f{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px}
.deal s{color:#9FB8D3;margin-left:6px;font-size:14px}
.deal .btn{background:#BFE3F8;color:#0B1E3F}
.deal .step{background:#fff;color:#0B1E3F;border-color:transparent}

/* tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:26px;scrollbar-width:thin}
.tab{flex:none;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:14.5px}
.tab[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg);border-color:transparent}
.group+.group{margin-top:44px}
.group h3{font:600 clamp(1.8rem,3.6vw,2.4rem)/1.05 var(--font-display);margin-bottom:4px}
.group>p{color:var(--muted);margin-bottom:18px}

/* testimonials */
.quotes{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.quote{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;display:grid;gap:14px;align-content:start}
.quote q{font:italic 500 23px/1.25 var(--font-display);quotes:none}
.quote cite{font-style:normal;color:var(--muted);font-size:13.5px}
.note{font-size:13px;color:var(--muted);margin-top:16px}

/* gallery */
.gal{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr))}
.g{aspect-ratio:1;max-width:100%;border-radius:16px;position:relative;display:grid;place-items:center;background:linear-gradient(160deg,var(--tile-a),var(--tile-b));overflow:hidden;transition:transform .25s}
.g:hover{transform:scale(1.02)}
.g .glyph{width:54%}
.g.navy{background:linear-gradient(160deg,#13305F,#0B1E3F)}
.g .cap{position:absolute;left:12px;bottom:9px;right:12px;font-size:12.5px;font-weight:500;color:var(--fg)}
.g.navy .cap{color:#EAF5FD}
.ig-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ig-head .brand-mark{width:44px;height:44px}
.ig-head b{display:block;line-height:1.2}
.ig-head small{color:var(--muted)}

/* order, contact, forms */
.order{display:grid;gap:28px;align-items:start}
@media(min-width:900px){.order{grid-template-columns:1.25fr 1fr}}
.order>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:14px}

.field{display:grid;gap:5px}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:15px}
.field textarea{min-height:96px;resize:vertical}
.line{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;font-variant-numeric:tabular-nums}
.line span:first-child{min-width:0}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:12px;font-weight:600;font-size:18px}
.empty{color:var(--muted);font-size:15px}
.info{display:grid;gap:18px}
.info b{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.info p{font-size:17px;overflow-wrap:anywhere}
.cta{background:linear-gradient(165deg,#0B1E3F,#12295A);color:#fff;text-align:center}
.cta .wrap{display:grid;gap:16px;justify-items:center;padding-block:clamp(44px,7vw,80px)}
.cta h2{max-width:18ch}
.cta p{color:#CFE3F4;max-width:46ch}

/* footer */
.foot{background:#08162E;color:#C3D8EC}
.foot .wrap{display:grid;gap:28px;padding-block:44px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.foot h4{margin:0 0 10px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#BFE3F8}
.foot a{display:block;text-decoration:none;padding:3px 0;color:#E4F1FB}
.foot a:hover{text-decoration:underline}
.foot p{font-size:14.5px}
.foot .tag{font:italic 500 22px/1.2 var(--font-display);color:#fff;margin-top:10px}
.foot .brand-mark{width:60px;height:60px}
.foot .brand-mark.logo{background:none}
.legal{border-top:1px solid #1B3158;padding-block:16px;font-size:13px;color:#8FA9C5}
.wa-float{position:fixed;z-index:25;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:inline-flex;align-items:center;gap:8px;background:var(--wa);color:#fff;text-decoration:none;font-weight:600;font-size:14.5px;padding:13px 18px;border-radius:999px;box-shadow:0 10px 26px rgba(0,0,0,.3)}
@media(max-width:560px){.wa-float .lbl{display:none}.wa-float{padding:14px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
